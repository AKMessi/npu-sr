name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Windows App Runtime (x64 CI, CPU tests only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/2.5/2.5.1/windowsappruntimeinstall-x64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '--quiet' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "App Runtime installer failed: $($process.ExitCode)" }
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Install FFmpeg for real CPU video integration (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Acquire pinned native FFmpeg for CPU video integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = python scripts/download_ffmpeg.py --architecture x64
          Split-Path $tool | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Acquire hash-checked model for CPU integration
        run: |
          python scripts/download_model.py
          npu-sr models download espcn-x2-256
          npu-sr models download fsrcnn-small-x2
          npu-sr models download fsrcnn-x2
          npu-sr models download lapsrn-x2
          npu-sr models download dncnn-25
      - name: Test CPU and failure paths (no NPU expected)
        run: python -m pytest -m "not npu and not video_hw"
      - name: Build and validate public artifacts
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_project.py
          npu-sr --version
